<title>Infinite Hike</title>
<style>

  h1 { font-family: 'Barrio', Georgia, serif; font-weight: normal; font-size: clamp(40px, 7.5vw, 76px); letter-spacing: .04em; line-height: 1.05; margin: 0 0 10px; }
  .sub { font-style: italic; opacity: .85; margin-bottom: 28px; font-size: 17px; }
  button { font: inherit; color: inherit; background: #ffffff14; border: 1px solid #ffffff55; border-radius: 3px; cursor: pointer; }
  #go { font-size: 19px; letter-spacing: .14em; text-transform: uppercase; padding: 13px 34px; background: #d8c98f; color: #1b1a12; border-color: #d8c98f; }
  #go:hover { background: #eadc9f; }
  table { margin: 28px auto 20px; border-collapse: collapse; font-size: 14.5px; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  td { padding: 3px 10px; text-align: left; opacity: .92; } td:first-child { text-align: right; opacity: .65; }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font: 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; opacity: .9; }
  .credit { margin-top: 26px; font: 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: .04em; }
  .credit a { color: inherit; opacity: .7; text-underline-offset: 3px; } .credit a:hover { opacity: 1; }
  .q { padding: 5px 12px; } .q.sel { background: #f1ecdf; color: #1b1a12; }
  #hud, #stats, #toast { position: fixed; font: 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: .04em; text-shadow: 0 1px 6px #000c; pointer-events: none; z-index: 3; }
  #hud { left: 84px; bottom: 15px; opacity: .85; white-space: pre; }
  .ib { position: fixed; bottom: 9px; width: 28px; height: 28px; padding: 5px; border-radius: 50%; z-index: 3; opacity: .6; line-height: 0; }
  .ib:hover { opacity: 1; } #bs { left: 12px; } #ba { left: 46px; }
  .ib svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #bs .x { display: none; } #bs.off .x { display: inline; } #bs.off .w { display: none; } #bs.off { opacity: .45; }
  #ba.on { background: #d8c98f; color: #1b1a12; border-color: #d8c98f; opacity: .95; }
  #stats { right: 18px; bottom: 14px; display: none; opacity: .8; }
  #toast { left: 50%; top: 9%; transform: translateX(-50%); font-size: 16px; opacity: 0; transition: opacity .5s; letter-spacing: .12em; text-transform: uppercase; }
  #toast.on { opacity: .95; }
  #mbtn { position: fixed; right: 14px; top: 12px; width: 36px; height: 36px; font-size: 18px; z-index: 3; opacity: .55; }
  .tb { position: fixed; right: 22px; width: 64px; height: 64px; border-radius: 50%; font-size: 24px; z-index: 3; display: none; touch-action: none; }
  #tf { bottom: 110px; } #tb { bottom: 34px; }
  @media (pointer: coarse) { .tb { display: block; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="stats"></div><div id="toast"></div>
<button id="mbtn" title="Menu">≡</button>
<button id="bs" class="ib" title="Sound on / off (M)" tabindex="-1"><svg viewBox="0 0 16 16"><path d="M2.5 6h2.6L8.5 3v10L5.1 10H2.5z" fill="currentColor" stroke="none"/><path class="w" d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 3.8a6 6 0 0 1 0 8.4"/><path class="x" d="M10.5 6l4 4M14.5 6l-4 4"/></svg></button>
<button id="ba" class="ib" title="Auto-walk on / off (Space)" tabindex="-1"><svg viewBox="0 0 16 16"><path d="M3.5 3.5L8 8l-4.5 4.5M8.5 3.5L13 8l-4.5 4.5"/></svg></button>
<button id="tf" class="tb">▲</button><button id="tb" class="tb">▼</button>
<div id="menu"><div class="panel">
  <h1>Infinite Hike</h1>
  <div class="sub">A trail that never ends. Forest, meadow, mountain, and back again.</div>
  <button id="go">Start hiking</button>
  <table>
    <tr><td>W / S or ↑ / ↓</td><td>walk forward / back</td></tr>
    <tr><td>Space</td><td>auto-walk on / off</td></tr>
    <tr><td>Shift</td><td>jog</td></tr>
    <tr><td>Drag, or A / D</td><td>look around</td></tr>
    <tr><td>T</td><td>time of day</td></tr>
    <tr><td>M &nbsp; H &nbsp; Esc</td><td>sound, stats, this menu</td></tr>
  </table>
  <div class="qs" style="margin-bottom:10px">Start in <button class="q sp sel">Anywhere</button><button class="q sp">Forest</button><button class="q sp">Autumn forest</button><button class="q sp">Meadow</button><button class="q sp">Alpine</button></div>
  <div class="qs">Detail <button class="q">Low</button><button class="q">Medium</button><button class="q">High</button></div>
  <div class="credit"><a href="https://github.com/Noniv/abyssal-garden" target="_blank" rel="noopener">Inspired by Abyssal Garden</a></div>
</div></div>
<div id="load"><span>Growing the forest</span><div id="track"><div id="bar"></div></div></div>
<div id="msg"></div>
